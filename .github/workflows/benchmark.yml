name: Reproduce benchmark

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify fixtures and diagnostic controls
        run: |
          openssl version
          python -m unittest discover -s . -p test_benchmark.py -v
      - name: Reproduce published categorical outcomes
        run: |
          cp results/benchmark.csv /tmp/recorded-benchmark.csv
          python run_benchmark.py
          diff -u /tmp/recorded-benchmark.csv results/benchmark.csv
